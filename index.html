<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="TU/e DS&AI additional admissions form"
    />
    <title>Additional Admissions Form</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="brand-lockup">
          <img
            id="tueLogo"
            class="tue-logo"
            alt="Eindhoven University of Technology"
          />
          <div class="brand-copy">
            <p class="app-kicker">
              TU/e MSc Data Science &amp; Artificial Intelligence
            </p>
            <h1 id="appTitle">Additional Admissions Form</h1>
          </div>
        </div>
        <span id="appYear" class="app-year"></span>
      </header>

      <main
        id="surveyShell"
        class="survey-shell"
        aria-label="DS&AI additional admissions form"
      >
        <div id="surveyElement"></div>
      </main>

      <template id="reportPageTemplate">
        <section
          id="completionActions"
          class="report-page"
          aria-live="polite"
        >
          <div class="report-page__content">
            <header class="report-page__header">
              <h2 id="reportTitle">Creating your application PDF</h2>
              <p id="completionStatus" role="status">
                Please wait while the PDF and embedded Output JSON are
                prepared.
              </p>
            </header>

            <div class="report-file">
              <svg
                class="document-icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path d="M6 3h8l4 4v14H6V3Z" />
                <path d="M14 3v5h4M9 12h6M9 16h6" />
              </svg>
              <span id="pdfFilename" class="report-filename"></span>
            </div>

            <button
              id="downloadPdf"
              class="primary-download"
              type="button"
              disabled
            >
              <svg
                class="download-icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path d="M12 3v12m0 0 4-4m-4 4-4-4M5 17v3h14v-3" />
              </svg>
              Download application PDF
            </button>

            <!-- Debug-only standalone JSON download. To restore it, uncomment
            this button and the matching downloadJson sections in src/main.js.
            <button
              id="downloadJson"
              class="secondary-download"
              type="button"
              disabled
            >
              Download output JSON (optional, for your records)
            </button>
            -->
          </div>
        </section>
      </template>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
