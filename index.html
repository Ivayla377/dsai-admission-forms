<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="TU/e DS&AI additional information form"
    />
    <title>Additional Information Form</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="brand-lockup">
          <img
            id="tueLogo"
            class="tue-logo"
            alt="Eindhoven University of Technology"
          />
          <div class="brand-copy">
            <p class="app-kicker">
              TU/e MSc Data Science &amp; Artificial Intelligence
            </p>
            <h1 id="appTitle">Additional Information Form</h1>
          </div>
        </div>
        <span id="appYear" class="app-year"></span>
      </header>

      <main
        id="surveyShell"
        class="survey-shell"
        aria-label="DS&AI additional information form"
      >
        <div id="surveyElement"></div>
      </main>

      <template id="reportPageTemplate">
        <section
          id="completionActions"
          class="report-page"
          aria-live="polite"
        >
          <div class="report-page__content">
            <section
              class="report-review"
              aria-label="Review your information"
            >
              <div id="reportReviewSummary" class="report-review__summary">
                Checking for likely omissions...
              </div>
            </section>

            <section class="report-download" aria-labelledby="reportTitle">
              <header class="report-page__header">
                <p
                  id="reportAcademicYear"
                  class="report-download__academic-year"
                ></p>
                <h2 id="reportTitle">DS&amp;AI Additional Information Form</h2>
                <p id="completionStatus" role="status">
                  Please wait while the PDF and embedded Output JSON are
                  prepared.
                </p>
              </header>

              <button
                id="downloadPdf"
                class="primary-download"
                type="button"
                disabled
              >
                <svg
                  class="download-icon"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >
                  <path d="M12 3v12m0 0 4-4m-4 4-4-4M5 17v3h14v-3" />
                </svg>
                Download application PDF
              </button>

              <!-- Debug-only standalone JSON download. To restore it,
              uncomment this button and the matching downloadJson sections in
              src/main.js.
              <button
                id="downloadJson"
                class="secondary-download"
                type="button"
                disabled
              >
                Download output JSON (optional, for your records)
              </button>
              -->
            </section>
          </div>
        </section>
      </template>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
